name: Museum Rankings checks and Pages

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  story-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit (rules), integration (stored visits) and system (browser) tests for the charter's stories.
      # A failure here stops the deploy below.
      - name: Run story tests
        run: npm test

  publish:
    # Deploys only from main, only after the tests pass, and only once Pages is turned on for the repo
    # (Settings → Pages → GitHub Actions, then set the repository variable PAGES_ENABLED to true).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: story-tests
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only the museum app; the other files in the repo are earlier class exercises.
      - name: Stage the museum app
        run: |
          mkdir site
          cp -r assets index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

