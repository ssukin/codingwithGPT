name: Museum Rankings checks and Pages

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  story-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify visit storage and friend tagging
        run: npm test

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: story-tests
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static site
        run: |
          mkdir site
          cp -r assets *.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

