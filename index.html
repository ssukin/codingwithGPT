<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11152b">
  <title>Magic 8 Ball</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-rounded, "Segoe UI", system-ui, sans-serif;
      background: #11152b;
      color: #f5f4ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(82, 67, 167, .3), transparent 38rem),
        radial-gradient(circle at 12% 18%, rgba(88, 195, 255, .15) 0 1px, transparent 2px),
        radial-gradient(circle at 84% 25%, rgba(255, 255, 255, .35) 0 1px, transparent 2px),
        radial-gradient(circle at 22% 78%, rgba(255, 255, 255, .3) 0 1px, transparent 2px),
        #11152b;
    }

    main {
      width: min(100%, 520px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #b7b4db;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 9vw, 4.5rem);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .intro {
      margin: 16px 0 28px;
      color: #c2c1d7;
      font-size: 1.05rem;
    }

    .ball-wrap {
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      perspective: 900px;
    }

    .ball {
      width: min(72vw, 310px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 25%, #45475d 0, #202337 34%, #080a12 72%);
      box-shadow: inset -15px -22px 36px rgba(0, 0, 0, .72), inset 10px 10px 20px rgba(255, 255, 255, .14), 0 24px 70px rgba(0, 0, 0, .5), 0 0 70px rgba(129, 105, 255, .18);
      transition: transform .25s ease;
    }

    .ball.is-rolling { animation: roll .8s ease-in-out; }

    .window {
      width: 47%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      padding: 18px;
      border: 1px solid rgba(203, 192, 255, .6);
      border-radius: 50%;
      background: radial-gradient(circle at 45% 35%, #313073, #19184d 72%);
      box-shadow: inset 0 4px 15px rgba(0, 0, 0, .45), 0 0 24px rgba(126, 106, 255, .2);
    }

    #answer {
      max-width: 145px;
      margin: 0;
      color: #f2eeff;
      font-size: clamp(.95rem, 4vw, 1.15rem);
      font-weight: 750;
      line-height: 1.25;
      text-shadow: 0 1px 10px rgba(155, 146, 255, .65);
    }

    button {
      min-height: 54px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #b7a1ff, #8471ff);
      box-shadow: 0 8px 24px rgba(126, 106, 255, .35);
      color: #17132f;
      font: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(126, 106, 255, .48); }
    button:active { transform: translateY(1px) scale(.98); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    .hint { margin: 16px 0 0; color: #9695b2; font-size: .88rem; }

    @keyframes roll {
      0%, 100% { transform: rotate(0) scale(1); }
      25% { transform: rotate(-12deg) scale(.96); }
      55% { transform: rotate(14deg) scale(1.04); }
      80% { transform: rotate(-7deg) scale(.98); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little cosmic guidance</p>
    <h1>Magic 8 Ball</h1>
    <p class="intro">Ask a yes-or-no question, then give the ball a shake.</p>

    <div class="ball-wrap">
      <div class="ball" id="ball" aria-label="Magic 8 Ball">
        <div class="window"><p id="answer" aria-live="polite">8</p></div>
      </div>
    </div>

    <button id="ask-button" type="button">Shake the ball</button>
    <p class="hint">The universe has 20 answers. Choose wisely.</p>
  </main>

  <script>
    const answers = [
      "It is certain.", "It is decidedly so.", "Without a doubt.",
      "Yes, definitely.", "You may rely on it.", "As I see it, yes.",
      "Most likely.", "Outlook good.", "Yes.", "Signs point to yes.",
      "Reply hazy, try again.", "Ask again later.", "Better not tell you now.",
      "Cannot predict now.", "Concentrate and ask again.",
      "Don't count on it.", "My reply is no.", "My sources say no.",
      "Outlook not so good.", "Very doubtful."
    ];

    const ball = document.querySelector("#ball");
    const answer = document.querySelector("#answer");
    const askButton = document.querySelector("#ask-button");

    askButton.addEventListener("click", () => {
      askButton.disabled = true;
      answer.textContent = "…";
      ball.classList.remove("is-rolling");
      // Restart the animation so every click gives the ball a fresh shake.
      void ball.offsetWidth;
      ball.classList.add("is-rolling");

      window.setTimeout(() => {
        answer.textContent = answers[Math.floor(Math.random() * answers.length)];
        ball.classList.remove("is-rolling");
        askButton.disabled = false;
      }, 800);
    });
  </script>
</body>
</html>
