<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f9">
  <meta name="description" content="Discover Smithsonian museums in Washington, DC, save the ones you want to visit, and build a personal ranking." >
  <title>Museum Rankings — find your next favorite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/museums.js" defer></script>
  <script src="assets/visit-friends.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-frame">
    <header class="topbar">
      <a class="brand" href="#discover" data-view="discover" aria-label="Museum Rankings — discover museums">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">museum<span>rankings</span></span>
      </a>

      <nav class="primary-nav" aria-label="Main navigation">
        <button class="nav-link is-active" type="button" data-view="discover" aria-current="page">Discover</button>
        <button class="nav-link" type="button" data-view="ranking">Ranking</button>
        <button class="nav-link" type="button" data-view="leaderboard">Leaderboard</button>
      </nav>

      <button class="profile-button" type="button" data-view="profile" aria-label="Open profile and privacy">
        <span class="profile-avatar" id="profile-avatar">M</span>
        <span class="profile-label" id="profile-label">My profile</span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </button>
    </header>

    <main id="main-content" class="main-content" tabindex="-1">
      <div id="view-content" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <span>Made for curious afternoons in Washington, DC.</span>
      <span><a href="https://www.si.edu/visit/museums" target="_blank" rel="noopener noreferrer">Check official museum details ↗</a><span class="footer-dot">·</span> Independent project, not affiliated with the Smithsonian.</span>
    </footer>
  </div>

  <dialog class="dialog museum-dialog" id="museum-dialog" aria-labelledby="museum-dialog-title"></dialog>
  <dialog class="dialog visit-dialog" id="visit-dialog" aria-labelledby="visit-dialog-title"></dialog>
  <dialog class="dialog compare-dialog" id="compare-dialog" aria-labelledby="compare-dialog-title"></dialog>
  <dialog class="dialog add-friends-dialog" id="add-friends-dialog" aria-labelledby="add-friends-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
