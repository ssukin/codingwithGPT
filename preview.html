<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Somewhere on the spectrum</title>
<style>
:root{--ink:#302b39;--paper:#f8f5ef;--purple:#746188}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #8a63af;outline-offset:5px}
.shell{max-width:1000px;margin:auto;padding:28px 30px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.brand{font-weight:800;letter-spacing:-.5px;font-size:20px;text-transform:none}
.mark{display:inline-block;width:14px;height:14px;border-radius:50%;background:conic-gradient(#e48870,#ecc970,#a1bba8,#9194cf,#e48870);margin-right:8px}
.edition{color:#79717e;font-size:10px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:45px 0}
.screen{width:100%;animation:enter .45s ease}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.hero{text-align:center}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#7a6b83}
h1,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-2px;line-height:1.03}
h1{font-size:clamp(48px,8vw,82px);margin:20px 0}
h1 em{color:#887094;font-weight:400}
.sub{color:#7a727e;font-size:14px;line-height:1.7;max-width:380px;margin:0 auto 25px}
.orb-wrap{height:190px;display:grid;place-items:center;position:relative;margin:10px auto 22px;width:240px}
.orb{height:160px;width:160px;border-radius:48% 52% 55% 45%;background:radial-gradient(circle at 27% 27%,#f5d7b2 0%,transparent 45%),radial-gradient(circle at 72% 28%,#c9b6e4 0%,transparent 50%),radial-gradient(circle at 36% 77%,#b4c7aa,transparent 55%),#b3b6dc;box-shadow:inset -10px -12px 30px #8a77992b,0 20px 40px #b3a2bb26;animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-10deg);border-radius:48% 52% 55% 45%}50%{transform:translateY(-9px) rotate(12deg);border-radius:55% 45% 48% 52%}}
.spark{position:absolute;font-family:Georgia,serif;font-size:27px;color:#9883a3;right:5px;top:12px}.spark.small{left:7px;top:125px;font-size:19px;right:auto}
.primary{border:0;background:var(--ink);color:#fff;border-radius:50px;padding:17px 30px;font-size:13px;transition:transform .2s,background .2s}
.primary:hover{background:#55455f;transform:translateY(-2px)}
.arrow{margin-left:25px}
.note{font-size:10px;color:#928995;margin-top:16px;letter-spacing:.4px}
footer{border-top:1px solid #e5dfe5;padding-top:18px;display:flex;justify-content:space-between;gap:15px;font-size:10px;color:#918995}
.quiz{max-width:650px;margin:auto}
.progress-meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1px;color:#8a7a93}
.back{border:0;background:none;padding:10px 0;color:#716479;font-size:12px}
.track{height:3px;background:#e8e0ea;margin:13px 0 45px;border-radius:4px}
.fill{height:100%;background:#9e89ad;border-radius:4px;transition:width .3s}
h2{font-size:clamp(36px,6vw,52px);margin:16px 0}
.hint{font-size:13px;color:#8a7e8d;line-height:1.6;margin-bottom:30px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{text-align:left;background:#ffffff88;border:1px solid #e4dce7;border-radius:16px;padding:22px 20px;min-height:107px;color:var(--ink);transition:all .18s;display:flex;align-items:flex-start;gap:13px;line-height:1.45;font-size:14px}
.option:hover{background:#eee6f3;border-color:#b8a3c7;transform:translateY(-2px)}
.letter{font-family:Georgia,serif;color:#a18baa;font-size:19px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}
.color-card{background:#fff;padding:14px 14px 21px;box-shadow:0 16px 45px #54415d13;transform:rotate(-3deg);border-radius:4px}
.swatch{height:310px;position:relative;overflow:hidden;display:grid;place-items:center}
.swatch:before{content:"";position:absolute;width:210px;height:210px;border:1px solid #ffffff60;border-radius:50%}
.swatch:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff30;border-radius:50%}
.swatch-star{font-family:Georgia,serif;font-size:110px;color:#ffffffb0;position:relative;z-index:1}
.card-caption{display:flex;justify-content:space-between;align-items:center;padding:19px 5px 0;font-size:11px}
.card-caption strong{font-family:Georgia,serif;font-size:20px;font-weight:400}
.result h2{font-size:54px;margin:15px 0 20px}
.description{font-size:14px;line-height:1.85;color:#786c80}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0}
.tag{font-size:10px;border:1px solid #dfd4e4;padding:7px 10px;border-radius:20px}
.palette{display:flex;height:25px;border-radius:7px;overflow:hidden;margin:10px 0 24px}
.palette span{flex:1}
.actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.text-btn{background:none;border:0;color:#77627f;font-size:12px;padding:12px 0;text-decoration:underline;text-underline-offset:4px}
.toast{font-size:11px;color:#786483;min-height:17px;margin-top:12px}
@media(max-width:620px){.shell{padding:23px 20px}.edition{font-size:8px;letter-spacing:1px}main{padding:32px 0}.result{grid-template-columns:1fr;gap:32px}.color-card{max-width:300px;margin:auto;width:90%}.swatch{height:220px}.result h2{font-size:45px}.options{gap:9px}.option{padding:18px 13px;font-size:13px}.track{margin-bottom:30px}footer{font-size:9px}.orb-wrap{height:170px}.orb{width:145px;height:145px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><span class="mark"></span>hue are you?</div><span class="edition">a tiny personality experiment</span></header>
<main id="app"></main>
<footer><span>A little intuition. A little color theory.</span><span>For fun, obviously. ✳</span></footer>
</div>
<script>
const app=document.getElementById('app');
const questions=[
{title:"An evening opens up.<br>Where do you go?",hint:"No plans. No obligations. Just instinct.",options:[
["Somewhere loud enough to become a story.",[1,1,.3,.8]],
["A tiny dinner with my favorite people.",[.9,.3,.5,.2]],
["Out walking, with absolutely no destination.",[.3,.4,.7,.6]],
["Home. The lighting there understands me.",[.3,.1,.9,.3]]]},
{title:"Pick a small, unreasonable joy.",hint:"The one you’d defend with your whole chest.",options:[
["Buying the weirdest thing at the flea market.",[.6,.8,.5,1]],
["The first sip of a perfectly made drink.",[.8,.4,.4,.2]],
["Rain against a window when I’m inside.",[.1,.1,1,.3]],
["Making someone laugh when they shouldn’t.",[1,1,.3,.7]]]},
{title:"Your friends send you a crisis text.",hint:"What’s your natural role in the group chat?",options:[
["The plan. The spreadsheet. The escape route.",[.3,.5,.8,.1]],
["The voice note that makes them feel held.",[1,.2,.7,.2]],
["The wildly unexpected but useful perspective.",[.3,.7,.6,1]],
["“Put your shoes on. I’m coming over.”",[.9,1,.4,.4]]]},
{title:"Choose a place to disappear.",hint:"Imagine you could step into it right now.",options:[
["A sun-warmed kitchen, windows wide open.",[1,.5,.3,.2]],
["A strange little city after midnight.",[.2,.8,.9,1]],
["A garden that’s getting a little overgrown.",[.4,.2,.7,.5]],
["A cliff above an impossibly blue sea.",[.1,.7,.6,.4]]]},
{title:"What do you want more of?",hint:"Last one. Pick for the person you are today.",options:[
["A little more nerve.",[.8,1,.4,.8]],
["A little more softness.",[.9,.1,.6,.2]],
["A little more mystery.",[.1,.4,1,1]],
["A little more room to breathe.",[.3,.1,.7,.3]]]}
];
const colors=[
{name:"Apricot Hour",hex:"#E8A17D",v:[.95,.45,.35,.25],star:"☀",tags:["warm presence","small pleasures","quiet optimism"],desc:"You have the energy of the best part of a long afternoon. You make ordinary things feel worth lingering over, and people tend to unclench around you. Your particular magic is making a moment feel like enough.",palette:["#E8A17D","#F0D4AD","#9DAD93","#F7ECE0"]},
{name:"Electric Persimmon",hex:"#E46C48",v:[.9,.95,.35,.7],star:"✷",tags:["first to jump","big-hearted","story collector"],desc:"You bring the plot. There’s warmth in your boldness: you want people to come along, try the thing, and have something to talk about later. You’re the color of a very good idea that might run a little late.",palette:["#E46C48","#EDB45B","#74618D","#F3DFCA"]},
{name:"Velvet Afterhours",hex:"#715B89",v:[.2,.4,.95,.8],star:"✧",tags:["private universe","sharp intuition","beautifully peculiar"],desc:"You’re a little hard to summarize, which is part of the appeal. You notice the undertones, keep a rich inner world, and tend to find beauty slightly off the main road. People feel there’s another chapter to you. There usually is.",palette:["#715B89","#B3A1C8","#D19B85","#E6DBE7"]},
{name:"Wild Sage",hex:"#91A58C",v:[.4,.2,.7,.4],star:"❋",tags:["room to breathe","steady heart","gentle independence"],desc:"You have a grounded, quietly independent kind of presence. You’re drawn to things that feel lived-in and real, and you don’t need every moment to perform. Your energy says: take your time. We can figure it out.",palette:["#91A58C","#CBD0B6","#BA9277","#F1EBDD"]},
{name:"Deepwater Blue",hex:"#4F7D98",v:[.1,.55,.8,.3],star:"✳",tags:["clear perspective","quiet conviction","open horizons"],desc:"You bring perspective when everything feels a little crowded. There’s feeling beneath your composure, and a strong instinct to find a way forward. You’re the person who opens a window, asks the useful question, and makes the whole situation feel more possible.",palette:["#4F7D98","#99BAC3","#D6AD83","#E7E8DF"]},
{name:"Rosewater",hex:"#CD929F",v:[.9,.2,.7,.2],star:"✿",tags:["emotional radar","soft strength","thoughtful rituals"],desc:"You pay attention in ways people remember. The check-in, the remembered detail, the exact right words: those are your colors. Your softness has substance to it. You make connection feel intentional, and care feel like something you can actually see.",palette:["#CD929F","#E6BEC1","#9D8DA7","#F4E7DC"]},
{name:"Acid Daydream",hex:"#B7C85B",v:[.5,.8,.45,1],star:"✺",tags:["unexpected angle","curious mind","excellent oddball"],desc:"Your instincts take the interesting exit. You like a little friction, a good discovery, and something that can’t be neatly explained. You bring freshness to familiar rooms, often by asking the question nobody else thought to ask.",palette:["#B7C85B","#DEDDA1","#8C78AF","#F0EACF"]},
{name:"Blue Hour",hex:"#8A96BC",v:[.25,.15,.9,.4],star:"☾",tags:["deep observer","slow magic","inner world"],desc:"You’re tuned into the in-between: the pause before an answer, a familiar place at a strange hour, the feeling a song leaves behind. You don’t need to be the loudest presence to change the atmosphere. You make space for things to mean something.",palette:["#8A96BC","#C2C7DE","#C39FA9","#ECE7DE"]}
];
let answers=[],step=0,current=null;
function home(){
answers=[];step=0;
app.innerHTML=`<section class="screen hero"><div class="eyebrow">Your personality, in pigment</div><h1>If you were a color,<br><em>which would you be?</em></h1><div class="orb-wrap" aria-hidden="true"><div class="orb"></div><span class="spark">✧</span><span class="spark small">✦</span></div><p class="sub">Five tiny choices. One very specific shade of you.<br>Go with your gut. It has excellent taste.</p><button class="primary" onclick="quiz()">Find my color <span class="arrow">↗</span></button><p class="note">About a minute · no sign-up · just vibes</p></section>`;
}
function quiz(){
const q=questions[step];
app.innerHTML=`<section class="screen quiz"><div class="progress-meta"><button class="back" onclick="back()">← Back</button><span>0${step+1} / 05</span></div><div class="track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${step}"><div class="fill" style="width:${step*20}%"></div></div><div class="eyebrow">Follow your first instinct</div><h2 tabindex="-1" id="heading">${q.title}</h2><p class="hint">${q.hint}</p><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${o[0]}</span></button>`).join('')}</div></section>`;
document.getElementById('heading').focus({preventScroll:true});
}
function choose(i){answers[step]=i;if(step<4){step++;quiz()}else{result()}}
function back(){if(step===0)home();else{step--;quiz()}}
function result(){
const vector=[0,0,0,0];
answers.forEach((a,i)=>questions[i].options[a][1].forEach((v,j)=>vector[j]+=v/5));
current=colors.reduce((best,c)=>{
const distance=c.v.reduce((sum,v,i)=>sum+(v-vector[i])**2,0);
return distance<best.d?{c,d:distance}:best;
},{c:colors[0],d:Infinity}).c;
const c=current;
app.innerHTML=`<section class="screen result"><div class="color-card"><div class="swatch" style="background:${c.hex}"><span class="swatch-star">${c.star}</span></div><div class="card-caption"><strong>${c.name}</strong><span>${c.hex}</span></div></div><div><div class="eyebrow">The shade I think you are</div><h2>${c.name}.</h2><p class="description">${c.desc}</p><div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="eyebrow" style="font-size:9px">Your little corner of the spectrum</div><div class="palette" aria-label="Your complementary palette">${c.palette.map(h=>`<span style="background:${h}" title="${h}"></span>`).join('')}</div><div class="actions"><button class="primary" onclick="copyColor()">Copy my color <span class="arrow">↗</span></button><button class="text-btn" onclick="home()">Meet another side of me</button></div><div class="toast" role="status" id="toast"></div></div></section>`;
}
async function copyColor(){
const t=`My color is ${current.name} (${current.hex}). ${current.tags.join(' · ')}.`;
try{await navigator.clipboard.writeText(t);document.getElementById('toast').textContent="Copied. A tiny piece of you, ready to paste."}
catch(e){document.getElementById('toast').textContent=`Your shade: ${current.name} · ${current.hex}`}
}
home();
</script>
</body>
</html>
